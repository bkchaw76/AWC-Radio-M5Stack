name: Core2 firmware build

on:
  push:
    branches: [main, feature/core2-radio-v01]
    paths:
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - ".github/workflows/firmware.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile M5Stack Core2
        run: pio run -e m5stack-core2
      - name: Collect firmware
        run: |
          mkdir -p dist
          cp .pio/build/m5stack-core2/firmware.bin dist/firmware.bin
          cp .pio/build/m5stack-core2/bootloader.bin dist/bootloader.bin
          cp .pio/build/m5stack-core2/partitions.bin dist/partitions.bin
          cat > dist/FLASH.txt <<'EOF'
          For an initial USB flash use:
          pio run -t upload
          For direct flashing, obtain the flashing offsets from PlatformIO's build output.
          Do not flash only firmware.bin at address 0x0000.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: AWC-Radio-Core2-v0.1
          path: dist/
          if-no-files-found: error
          retention-days: 30
