name: Core2 firmware build

on:
  push:
    branches: [main, feature/core2-radio-v01]
    paths:
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - ".github/workflows/firmware.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile M5Stack Core2
        run: pio run -e m5stack-core2
      - name: Collect firmware
        run: |
          mkdir -p dist
          cp .pio/build/m5stack-core2/firmware.bin dist/firmware.bin
          cp .pio/build/m5stack-core2/bootloader.bin dist/bootloader.bin
          cp .pio/build/m5stack-core2/partitions.bin dist/partitions.bin
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin dist/
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin -o dist/AWC-Radio-Core2-Full.bin --flash_mode dio --flash_freq 40m --flash_size 16MB 0x1000 dist/bootloader.bin 0x8000 dist/partitions.bin 0xe000 dist/boot_app0.bin 0x10000 dist/firmware.bin
          cat > dist/FLASH.txt <<'EOF'
          M5Stack Core2 / Core2 v1.3 only.
          Flash AWC-Radio-Core2-Full.bin at 0x0000 using ESP32, DIO, 40 MHz, 16 MB.
          This replaces the bootloader, partition table and application.
          Back up existing firmware/data before flashing.
          OTA: upload firmware.bin using System settings > OTA firmware update on trusted LAN.
          Application-only serial update: firmware.bin at 0x10000, only with matching partitions.
          Windows: install Python 3, then run Flash-Windows.bat.
          EOF
          cat > dist/Flash-Windows.bat <<'EOF'
          @echo off
          cd /d "%~dp0"
          py -3 -m pip install "esptool>=4.8,<5" || goto fail
          py -3 -m serial.tools.list_ports
          set /p PORT=Enter Core2 COM port (e.g. COM5): 
          if not defined PORT goto fail
          echo This replaces the existing firmware. Back up first.
          choice /M "Continue flashing"
          if errorlevel 2 exit /b 1
          py -3 -m esptool --chip esp32 --port "%PORT%" --baud 460800 write_flash 0x0000 AWC-Radio-Core2-Full.bin || goto fail
          echo Flash successful. Reset the Core2.
          pause
          exit /b 0
          :fail
          echo Flash failed or cancelled.
          pause
          exit /b 1
          EOF
          printf 'Version: v0.6-preview\nCommit: %s\nBuild: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/VERSION.txt
          cat > dist/CHANGELOG.txt <<'EOF'
          v0.6 hardware-test preview
          Touchscreen setup, Wi-Fi profiles, Bluetooth discovery and saved receivers.
          Station artwork, favorites, metadata, volume, battery and car mode.
          Local-first HTTP with optional authenticated HTTPS fallback.
          OTA, diagnostics, watchdog, audio buffer and LCD optimizations.
          Bluetooth disconnect suspends streaming; reconnect resumes playback.
          Hardware validation pending; not a stable production release.
          EOF
          cat > dist/FIRST-BOOT.txt <<'EOF'
          1. Back up existing Core2 firmware and data.
          2. Connect USB data cable; run Flash-Windows.bat or flash merged binary at 0x0.
          3. Configure home Wi-Fi, scan a Bluetooth speaker in pairing mode, select it.
          4. Keep local server http://192.168.8.8:8088; leave remote blank initially.
          5. Save and restart; verify station list, artwork and audio.
          6. Test pause, volume, favorites, station switching and receiver reconnect.
          7. Check diagnostics before and after 60 minutes of playback.
          8. Configure optional HTTPS remote URL and credentials; test hotspot failover.
          9. Test car mode USB removal and restoration while parked.
          10. Test OTA only on trusted LAN with stable USB power.
          Record any errors, serial logs and diagnostic readings.
          EOF
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: AWC-Radio-Core2-v0.6-preview
          path: dist/
          if-no-files-found: error
          retention-days: 30
